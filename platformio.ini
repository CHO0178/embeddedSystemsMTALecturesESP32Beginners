; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:WROOM32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = 
    ;https://github.com/adafruit/DHT-sensor-library.git     ; temperature sensor library
    ;https://github.com/ESP32Async/AsyncTCP.git             ; TCP library for ESP32
    ;https://github.com/ESP32Async/ESPAsyncWebServer.git    ; Web Server library for ESP32
    ;https://github.com/madhephaestus/ESP32Servo.git        ; Servo library
    ;https://github.com/eduherminio/NewPing.git             ; Ultrasonic sensor HC-SR04 library
    ;https://github.com/xreef/PCF8574_library.git           ; I2C PCF8574 library
lib_ignore =
    ESPAsyncTCP
    RPAsyncTCP


[env:esp32-s3-devkitc-1-N8R8] # prostředí pro devkit ESP32 N8R8
platform = espressif32
board = esp32-s3-devkitc-1
; change microcontroller
board_build.mcu = esp32s3
; change MCU frequency
board_build.f_cpu = 240000000L
;,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_flags = 
    -DBOARD_HAS_PSRAM
;,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,
framework = arduino
;,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,
debug_tool = esp-builtin
upload_protocol = esptool
monitor_speed = 115200
lib_deps = 
	adafruit/DHT sensor library@^1.4.6
	esp32async/AsyncTCP@^3.4.9
	esp32async/ESPAsyncWebServer@^3.9.0

