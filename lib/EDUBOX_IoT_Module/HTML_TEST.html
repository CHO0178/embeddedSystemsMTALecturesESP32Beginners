<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Hladina vody cvičení</title>
</head>
<body style="text-align:center; font-family:sans-serif;">
  <h1>WaterLevel modul - Cvičení</h1>
  <h2>Aktuální hladina: <span id="percentValue">0</span> %</h2>

  <div id="chart" style="width:90%; max-width:500px; height:220px; border:2px solid black; margin:20px auto; 
                        display:flex; align-items:flex-end; gap:4px; padding:10px; box-sizing:border-box;"></div>
</body>

<script>
  let values = [];
  function drawChart() {
    const chart = document.getElementById('chart');
    chart.innerHTML = '';

    for (let i = 0; i < values.length; i++) {
      const bar = document.createElement('div');
      bar.style.width = '30px';
      bar.style.height = values[i] + '%';
      bar.style.backgroundColor = 'deepskyblue';
      chart.appendChild(bar);
    }
  }

  function fetchData() {
    fetch('/data')
      .then(response => response.json())
      .then(data => {
        document.getElementById('percentValue').innerText = data.percent;

        values.push(data.percent);
        if (values.length > 10) {
          values.shift();
        }

        drawChart();
      });
  }

  setInterval(fetchData, 1000);
  fetchData();
</script>
</html>
